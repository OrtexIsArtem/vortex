name: Release

# Push main first, then a tag such as v0.1.0. This builds Vortex and creates a draft GitHub Release to check and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest released Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
          xcodebuild -version
      - name: Checks and tests
        run: make check && swift test --package-path Packages
      - name: Build, versioned by the tag
        # Signed ad hoc here, then with the Vortex certificate below. Not notarized: that needs a paid Apple Developer
        # account. See "Install" in README.md.
        run: >
          xcodebuild -project Vortex.xcodeproj -scheme Vortex -configuration Release
          -destination "platform=macOS,arch=arm64" -derivedDataPath build/Release
          -skipMacroValidation ARCHS=arm64 CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
          MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
      - name: Sign with the Vortex certificate
        # One self-signed certificate for every release, so macOS keeps Vortex's permissions across updates.
        env:
          VORTEX_SIGNING_P12: ${{ secrets.VORTEX_SIGNING_P12 }}
          VORTEX_SIGNING_PASSWORD: ${{ secrets.VORTEX_SIGNING_PASSWORD }}
        run: scripts/sign-release.sh build/Release/Build/Products/Release/Vortex.app
      - name: Launch check
        # A signature macOS refuses to load shows only at launch: the signed app must still run after a few seconds.
        # Run from the build folder, it stops at the offer to move to Applications, so this proves that macOS loads
        # its code and libraries, not more.
        run: |
          executable=build/Release/Build/Products/Release/Vortex.app/Contents/MacOS/Vortex
          "$executable" > launch.log 2>&1 &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            cat launch.log
            echo "::error::Vortex quit within 8 seconds of launch"
            exit 1
          fi
          kill "$pid"; sleep 2; kill -9 "$pid" 2>/dev/null || true
      - name: Third-party notices
        run: |
          {
            echo "Vortex includes the following open-source software, under the licenses below."
            for dir in build/Release/SourcePackages/checkouts/*/; do
              license=$(ls "$dir" | grep -iE '^(LICENSE|LICENCE|COPYING)' | head -1)
              [ -n "$license" ] || continue
              printf '\n==== %s ====\n\n' "$(basename "$dir")"
              cat "$dir$license"
            done
          } > THIRD-PARTY-NOTICES.txt
      - name: Zip
        run: |
          mkdir -p dist/Vortex
          ditto build/Release/Build/Products/Release/Vortex.app dist/Vortex/Vortex.app
          cp LICENSE THIRD-PARTY-NOTICES.txt dist/Vortex/
          (cd dist && ditto -c -k --keepParent Vortex "../Vortex-${GITHUB_REF_NAME}.zip")
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "Vortex-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "Vortex-${GITHUB_REF_NAME}.zip" --draft --title "Vortex ${GITHUB_REF_NAME#v}" --generate-notes
          fi
