name: Release

# Push a tag such as v0.1.0 to build Vortex and publish it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build, signed ad hoc
        # Not notarized: that needs a paid Apple Developer account. See "Install" in README.md.
        run: >
          xcodebuild -project Vortex.xcodeproj -scheme Vortex -configuration Release
          -destination "platform=macOS,arch=arm64" -derivedDataPath build/Release
          -skipMacroValidation CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build
      - name: Zip
        run: ditto -c -k --keepParent build/Release/Build/Products/Release/Vortex.app "Vortex-${GITHUB_REF_NAME}.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Vortex-${GITHUB_REF_NAME}.zip" --title "Vortex ${GITHUB_REF_NAME#v}" --generate-notes
