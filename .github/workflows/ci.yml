name: CI

# The app's checks; changes to the website alone have their own (site.yml).
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/site.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest released Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
          xcodebuild -version
      - name: No network or processes outside their modules
        run: make check
      - name: Package tests
        run: swift test --package-path Packages
      - name: Release build, unsigned
        run: >
          xcodebuild -project Vortex.xcodeproj -scheme Vortex -configuration Release
          -destination "platform=macOS,arch=arm64" -derivedDataPath build/Release
          -skipMacroValidation ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
