name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest released Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e rc | sort -V | tail -1)" && xcodebuild -version
      - name: No network or processes outside their modules
        run: make check
      - name: Package tests
        run: swift test --package-path Packages
      - name: Release build, unsigned
        run: >
          xcodebuild -project Vortex.xcodeproj -scheme Vortex -configuration Release
          -destination "platform=macOS,arch=arm64" -derivedDataPath build/Release
          -skipMacroValidation CODE_SIGNING_ALLOWED=NO build
