name: Vortex

options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES

packages:
  VortexKit:
    path: Packages

targets:
  Vortex:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      # The texts of macOS prompts, in English and Ukrainian.
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        # Without these the app is English-only and Foundation never picks the uk tables of the packages.
        CFBundleLocalizations: [en, uk]
    # The bundle id and the signing team: Config/Vortex.xcconfig, then the git-ignored Config/Local.xcconfig.
    configFiles:
      Debug: Config/Vortex.xcconfig
      Release: Config/Vortex.xcconfig
    dependencies:
      - package: VortexKit
        product: VortexShell
    preBuildScripts:
      - name: "Rule: no network outside Secrets"
        script: '"$SRCROOT/scripts/check-no-network.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # KeyboardShortcuts ships no Ukrainian: ours (App/KeyboardShortcuts) goes into its bundle inside the app. The
      # input makes it run after Xcode has copied that bundle in.
      - name: "Ukrainian for KeyboardShortcuts"
        script: '"$SRCROOT/scripts/keyboard-shortcuts-uk.sh"'
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/KeyboardShortcuts_KeyboardShortcuts.bundle
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Vortex
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vortex
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Artem Pronenko"
        # Tasks read the address of the page open in a browser, with the user's permission per browser.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Vortex saves the address of the page open in your browser with a task."
        # The shelf and the clipboard read files in folders macOS guards, and the shelf watches folders there: the reason
        # macOS shows when it asks. The uk texts are in App/Resources/InfoPlist.xcstrings.
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "Vortex shows the files you put on its shelf or copy, and puts new files from watched folders on the shelf."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Vortex shows the files you put on its shelf or copy, and puts new files from watched folders on the shelf."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Vortex shows the files you put on its shelf or copy, and puts new files from watched folders on the shelf."
        CODE_SIGN_ENTITLEMENTS: App/Vortex.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # A release can't be attached to by a debugger: Xcode adds get-task-allow to ad-hoc and development signatures otherwise.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - package: VortexKit/VortexCoreTests
        - package: VortexKit/VortexPlatformTests
        - package: VortexKit/VortexShellTests
        - package: VortexKit/FeatureTemplateTests
        - package: VortexKit/FeatureClipboardTests
        - package: VortexKit/FeatureHomeTests
        - package: VortexKit/FeatureSecretsTests
        - package: VortexKit/FeatureShelfTests
        - package: VortexKit/FeatureTasksTests
        - package: VortexKit/FeatureTimerTests
