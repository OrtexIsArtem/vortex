<!doctype html>
<!-- The social preview, 1200 × 630: the notch with its ears, light from it, the vortex pouring in, and the wordmark.
     No sentences, so one picture serves every language. Rendered to public/og.png by og/render.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0a0b;
      }

      body {
        position: relative;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      }

      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 520px 300px at 600px 20px, rgb(255 255 255 / 0.16), rgb(255 255 255 / 0.05) 55%, transparent 100%);
      }

      canvas,
      svg {
        position: absolute;
        top: 0;
        left: 0;
      }

      .wordmark {
        position: absolute;
        top: 268px;
        left: 0;
        width: 100%;
        margin: 0;
        font-size: 176px;
        font-weight: 200;
        line-height: 1;
        letter-spacing: -0.045em;
        text-align: center;
      }

      .line {
        position: absolute;
        top: 486px;
        left: 0;
        width: 100%;
        margin: 0;
        color: #8e8e93;
        font: 24px ui-monospace, 'SF Mono', Menlo, monospace;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <canvas id="vortex" width="2400" height="1260" style="width: 1200px; height: 630px"></canvas>
    <svg id="notch" width="1200" height="120" viewBox="0 0 1200 120"></svg>
    <p class="wordmark">Vortex</p>
    <p class="line">macOS 14+ · Apple silicon · MIT</p>
    <script>
      // The site's shapes (src/lib/shape.ts) and vortex (src/scripts/vortex-art.ts), at 1.6 times the notch's size.
      const k = 1.6;
      const cx = 600;
      const notch = { width: 186 * k, height: 32 * k };
      const ear = 128;
      const outline = { width: notch.width + ear * 2, height: notch.height, radius: 14 * k, shoulder: 10 * k };

      function hangingPath({ width, height, radius, shoulder }, center) {
        const left = center - width / 2;
        const right = center + width / 2;
        const r = Math.min(radius, width / 2, height / 2);
        return `M${left - shoulder} 0A${shoulder} ${shoulder} 0 0 1 ${left} ${shoulder}L${left} ${height - r}A${r} ${r} 0 0 0 ${left + r} ${height}L${right - r} ${height}A${r} ${r} 0 0 0 ${right} ${height - r}L${right} ${shoulder}A${shoulder} ${shoulder} 0 0 1 ${right + shoulder} 0Z`;
      }

      // The vortex: the welcome's curves winding in to the notch, part of the way.
      const canvas = document.getElementById('vortex');
      const context = canvas.getContext('2d');
      context.scale(2, 2);
      const funnel = { cx, cy: notch.height / 2, width: 1200, height: 630 };
      const count = 44;
      const progress = 0.42;
      context.lineWidth = 1.1;
      for (let index = 0; index < count; index++) {
        const share = index / count;
        const jitter = (index * 0.381966) % 1;
        const outer = Math.max(funnel.width, funnel.height) * (0.55 + 0.45 * jitter) * 0.62;
        const squeeze = Math.pow(1 - progress, 1.35);
        const start = share * Math.PI * 2 + progress * Math.PI * 1.6;
        context.beginPath();
        for (let step = 0; step <= 60; step++) {
          const t = step / 60;
          const angle = start + t * Math.PI * 1.25;
          const radius = outer * (1 - 0.82 * t) * squeeze;
          const x = funnel.cx + Math.cos(angle) * radius * 1.35;
          const y = funnel.cy + Math.abs(Math.sin(angle)) * radius * 0.62;
          if (step === 0) context.moveTo(x, y);
          else context.lineTo(x, y);
        }
        const golden = (index * 0.618034) % 1;
        context.strokeStyle = `rgba(255, 255, 255, ${((0.08 + 0.34 * golden) * (1 - progress * 0.6)).toFixed(3)})`;
        context.stroke();
      }

      // The notch with its ears: the timer's ring and minutes on the left, the shelf and its files on the right.
      const ring = (x, y, value) => {
        const r = 7 * k;
        const c = 2 * Math.PI * r;
        return `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#2A2A2E" stroke-width="${2 * k}"/>
          <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#F5F5F7" stroke-width="${2 * k}" stroke-linecap="round"
            stroke-dasharray="${(c * value).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${x} ${y})"/>`;
      };
      const tray = (x, y) => {
        const s = (16 * k) / 24;
        return `<g transform="translate(${x - 12 * s} ${y - 12 * s}) scale(${s})" fill="none" stroke="#F5F5F7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 13.5 6 5.5h12l2.5 8V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z"/><path d="M3.5 13.5h5a3.5 3.5 0 0 0 7 0h5"/></g>`;
      };
      const mid = notch.height / 2;
      const leftEar = cx - notch.width / 2 - ear / 2;
      const rightEar = cx + notch.width / 2 + ear / 2;
      document.getElementById('notch').innerHTML = `
        <path d="${hangingPath(outline, cx)}" fill="#000" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <circle cx="${cx}" cy="${mid}" r="${3 * k}" fill="#0d111b"/>
        ${ring(leftEar - 26, mid, 0.62)}
        <text x="${leftEar - 6}" y="${mid}" fill="#F5F5F7" font-size="${13 * k}" font-weight="500" dominant-baseline="central"
          font-family="-apple-system, BlinkMacSystemFont, sans-serif" style="font-variant-numeric: tabular-nums">8:42</text>
        ${tray(rightEar - 14, mid)}
        <text x="${rightEar + 8}" y="${mid}" fill="#F5F5F7" font-size="${13 * k}" font-weight="500" dominant-baseline="central"
          font-family="-apple-system, BlinkMacSystemFont, sans-serif">3</text>`;
      document.fonts.ready.then(() => document.body.setAttribute('data-ready', ''));
    </script>
  </body>
</html>
